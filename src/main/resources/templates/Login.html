<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🌸 Secret Garden Login</title>

    <!-- Bootstrap + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@500&family=Quicksand:wght@500&display=swap" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            /* Anime pastel Fuji mountain background from Unsplash */
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Quicksand', sans-serif;

            /* Pastel effect filter */
            filter: contrast(0.9) saturate(0.8) brightness(1.1);
            overflow: hidden;
        }

        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 2;
            position: relative;
        }

        h2 {
            font-family: 'Kaisei Tokumin', serif;
            text-align: center;
            color: #2b4c2e;
            margin-bottom: 25px;
            font-size: 2.3rem;
        }

        label {
            color: #2e4e3c;
            font-weight: 600;
        }

        input.form-control {
            border-radius: 10px;
            border: 1.5px solid #b1d5b0;
        }

        .form-check-label {
            color: #3c5e4a;
        }

        .btn-forest {
            background: linear-gradient(145deg, #7fc87f, #5bb05b);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            padding: 10px 0;
            transition: background 0.3s ease;
        }

        .btn-forest:hover {
            background: linear-gradient(145deg, #6ccf6c, #499849);
        }

        .footer-text {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            color: #4c6c52;
        }

        /* 🦊 Fox Spirit */
        .fox-spirit {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 100px;
            z-index: 3;
        }

        /* 🌸 Sakura petals */
        .sakura {
            position: fixed;
            top: -10px;
            background: url('https://cdn-icons-png.flaticon.com/512/765/765514.png') no-repeat center;
            background-size: contain;
            width: 25px;
            height: 25px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(120vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- 🌸 Login card -->
    <div class="login-card">
        <h2>🌿 Welcome, Traveler 🌸</h2>

        <form method="post" action="https://localhost:8443/loginAPI/log">
            <div class="mb-3">
                <label for="username" class="form-label">🌱 Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="senpai123"
                        required
                />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">🌼 Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="••••••••"
                        required
                />
            </div>

            <div class="form-check mb-3">
                <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember-me"
                        name="remember-me"
                        value="true"
                        checked
                />
                <label class="form-check-label" for="remember-me">🌸 Remember Me</label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-forest">🌳 Login</button>
            </div>
        </form>

        <div class="footer-text">Your forest journey begins here... 🍃</div>
    </div>
</div>

<!-- 🌸 Sakura Petal Script -->
<script>
    const petalCount = 25;
    for (let i = 0; i < petalCount; i++) {
        let petal = document.createElement('div');
        petal.classList.add('sakura');
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = 5 + Math.random() * 5 + 's';
        petal.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(petal);
    }
</script>
</body>
</html>
